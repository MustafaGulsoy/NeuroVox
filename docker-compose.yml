services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: NeuroVoxDb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: NeuroVox/Dockerfile.api
    environment:
      NeuroVox__ConnectionString: "Host=postgres;Port=5432;Database=NeuroVoxDb;Username=user;Password=pass"
      NeuroVox__AiBaseUrl: "http://ai:8000/"
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "8080:8080"
    volumes:
      - ./data/audio:/data/audio
    depends_on:
      - postgres
      - ai

  ai:
    build:
      context: services/neurovox_ai
    ports:
      - "8000:8000"
    volumes:
      - ./data/audio:/data/audio

volumes:
  pgdata:
