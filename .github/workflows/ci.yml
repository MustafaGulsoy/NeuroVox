name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      # BaseAuth.Library is restored from the private Nexus feed in nuget.config (http://69.62.120.208:1010).
      - uses: actions/checkout@v4
      # .slnx needs a recent SDK (10.0.x); projects still target net8.0.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx ng build --configuration production
        working-directory: frontend

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/*/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r services/neurovox_ai/requirements-dev.txt pandas==2.2.3
      - run: python -m pytest -q services/neurovox_ai/tests services/neurovox_pipeline/tests

  docker:   # pull requests only: prove the images build (pushes to main build them in `deploy`)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [dotnet, python, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.api -t neurovox-api .
      - run: docker build -t neurovox-ai services/neurovox_ai
      - run: docker build -t neurovox-web frontend

  # Every push to main that passes the tests is built here and shipped to the VPS. The SSH key is restricted to
  # deploy/ci-deploy.sh on the server (forced command): it loads the images, switches compose tags, waits for health, rolls back on failure.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [dotnet, python, frontend]
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          TAG=$(git rev-parse --short=12 HEAD)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker build -f Dockerfile.api -t neurovox-api:$TAG .
          docker build -t neurovox-web:$TAG frontend
      - name: Ship and switch
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          docker save neurovox-api:$TAG neurovox-web:$TAG | gzip \
            | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@"$DEPLOY_HOST" "$TAG"
