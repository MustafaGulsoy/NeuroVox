<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>NeuroVox - Terapist Etiketleme</title>
<link rel="stylesheet" href="labeling.css" />
</head>
<body>
<header>
  <h1>NeuroVox — Kör Terapist Anotasyonu</h1>
  <p>Not: AI aday çıktıları bu ekranda gösterilmez. Bağımsız değerlendirmeden sonra AI sonuçları açılır.</p>
</header>

<section id="setup">
  <label>API adresi <input id="apiBase" value="" placeholder="(aynı kaynak)" /></label>
  <label>customerid <input id="customerId" /></label>
  <label>Recording Id <input id="recordingId" /></label>
  <button onclick="loadRecording()">Yükle</button>
</section>

<section id="workspace" hidden>
  <audio id="player" controls></audio>
  <div id="transcriptBox"></div>

  <h2>Yeni Anotasyon</h2>
  <div class="form">
    <label>Kategori
      <select id="category"></select>
    </label>
    <label>Şiddet <input id="severity" /></label>
    <label>Güven (0-1) <input id="confidence" type="number" step="0.1" min="0" max="1" /></label>
    <label>Başlangıç (sn) <input id="startSeconds" type="number" step="0.1" /></label>
    <label>Bitiş (sn) <input id="endSeconds" type="number" step="0.1" /></label>
    <label>Segment Metni <textarea id="segmentText"></textarea></label>
    <label>Not <textarea id="note"></textarea></label>
    <label>Annotator Id <input id="annotatorId" /></label>
    <label>Rater Index <input id="raterIndex" type="number" value="1" /></label>
    <label>Visit Id <input id="visitId" /></label>
    <button onclick="useCurrentTime()">▶ Şimdiki zamanı başlangıç yap</button>
    <button onclick="submitAnnotation()">Kaydet</button>
  </div>

  <h2>Annotasyonlarım</h2>
  <table id="annotationsTable">
    <thead><tr><th>Kategori</th><th>Başlangıç</th><th>Bitiş</th><th>Şiddet</th><th>Not</th></tr></thead>
    <tbody></tbody>
  </table>
</section>

<script src="labeling.js"></script>
</body>
</html>
